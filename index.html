<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>单词本</title>
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="单词本">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: linear-gradient(180deg, #f0f2f7, #e4e7f0);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #1f2328;
    overflow: hidden;
  }
  [hidden] { display: none !important; }

  /* ================= 布局 ================= */
  .app {
    height: 100vh;
    height: 100dvh;
    max-width: 720px;
    margin: 0 auto;
    padding: 10px 12px calc(8px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .review-top {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
    color: #6b7280;
    padding: 2px 4px;
    min-height: 22px;
  }
  .brand { font-weight: 700; color: #374151; font-size: 14px; white-space: nowrap; }
  .progress { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .only-unlearned {
    display: flex; align-items: center; gap: 5px;
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  .only-unlearned input { accent-color: #6366f1; width: 15px; height: 15px; cursor: pointer; }

  /* ================= 卡片舞台 ================= */
  .stage {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .card-slot {
    position: relative;
    --cw: 300px;              /* 卡片宽度，由 JS 计算写入 */
    width: 100%;
    max-width: 1200px;
    aspect-ratio: 1.98 / 1;
    flex-shrink: 0;
  }

  .flip-card {
    position: absolute;
    inset: 0;
    cursor: pointer;
    perspective: 1600px;
  }
  .flip-inner {
    position: relative;
    width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform .5s cubic-bezier(.4,.2,.2,1);
  }
  .flip-card.flipped .flip-inner { transform: rotateY(180deg); }

  .flip-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 40px;
    background: #fff;
    box-shadow:
      0 8px 24px rgba(17,24,39,.12),
      0 2px 6px rgba(17,24,39,.05),
      inset 0 0 0 1px rgba(17,24,39,.03);
    padding: clamp(20px, 4vw, 48px);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  
  .flip-face.front {
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  
  .flip-face.back {
    transform: rotateY(180deg);
    justify-content: safe center;
  }

  /* 正面单词 */
  .r-word {
    font-size: clamp(30px, 5vw, 56px);
    font-weight: 800;
    letter-spacing: .3px;
    line-height: 1.15;
    word-break: break-word;
    color: #111827;
  }
  .r-phonetic {
    margin-top: 10px;
    color: #8b9098;
    font-family: "Times New Roman", serif;
    font-size: clamp(15px, 2vw, 22px);
  }

  /* 背面内容 */
  .r-back-word {
    font-size: clamp(16px, 2vw, 20px);
    font-weight: 700;
    color: #4b5563;
    margin-bottom: 16px;
    word-break: break-word;
    flex-shrink: 0;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .r-back-word span { font-weight: 400; font-family: "Times New Roman", serif; color: #8b9098;}
  
  .r-pos {
    align-self: flex-start;
    font-size: 14px;
    color: #6b7280;
    margin-bottom: 12px;
    font-style: italic;
    flex-shrink: 0;
  }
  .r-meaning {
    font-size: clamp(20px, 2.8vw, 30px);
    font-weight: 600;
    line-height: 1.4;
    word-break: break-word;
    flex-shrink: 0;
    color: #1f2937;
  }
  .r-example {
    margin-top: 20px;
    font-size: clamp(15px, 1.6vw, 18px);
    color: #6b7280;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* 空状态 */
  .empty-stage {
    position: absolute;
    inset: 0;
    border-radius: 40px;
    background: #fff;
    box-shadow: 0 8px 24px rgba(17,24,39,.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: calc(var(--cw) * 0.03);
    text-align: center;
    padding: calc(var(--cw) * 0.08);
  }
  .empty-emoji { font-size: calc(var(--cw) * 0.15); line-height: 1; }
  .empty-title { font-size: calc(var(--cw) * 0.07); font-weight: 700; color: #374151; }
  .empty-sub { font-size: calc(var(--cw) * 0.05); color: #9ca3af; line-height: 1.6; }

  /* ================= 底部按钮栏 ================= */
  .dock {
    flex-shrink: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    padding: 6px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 6px 20px rgba(17,24,39,.08);
  }
  .dock button {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 8px 2px 7px;
    border: none;
    background: transparent;
    border-radius: 12px;
    cursor: pointer;
    color: #4b5563;
    font-size: 11.5px;
    font-weight: 500;
    transition: background .15s, transform .1s, color .15s;
  }
  .dock button .ico { font-size: 19px; line-height: 1; }
  .dock button:hover { background: #f3f4f8; }
  .dock button:active { transform: scale(.96); }
  .dock button:disabled { opacity: .35; cursor: default; transform: none; }
  .dock button.primary {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    box-shadow: 0 4px 13px rgba(99,102,241,.35);
  }
  .dock button.primary:hover { background: linear-gradient(135deg, #5457e8, #7c4ff0); }
  .dock button.done { color: #16a34a; background: #f0fdf4; }

  /* ================= 模态框 ================= */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(17,24,39,.5);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  #formModal { z-index: 210; }

  .modal-panel {
    width: 100%;
    max-width: 420px;
    max-height: 88vh;
    max-height: 88dvh;
    background: #fff;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.28);
  }
  .modal-panel.wide { max-width: 640px; }

  .modal-head {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 15px 18px 11px;
  }
  .modal-head h2 { margin: 0; font-size: 17px; }
  .count { font-weight: 400; color: #9ca3af; font-size: 13px; }
  .modal-close {
    flex-shrink: 0;
    border: none;
    background: #f3f4f6;
    width: 30px; height: 30px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    color: #6b7280;
    line-height: 1;
  }
  .modal-close:hover { background: #e5e7eb; }

  .modal-body { padding: 0 18px 18px; overflow-y: auto; }

  /* 表单 */
  input, select, textarea, button { font-family: inherit; font-size: 14px; }
  .field { margin-bottom: 10px; }
  .field input, .field select, .field textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #dcdfe4;
    border-radius: 10px;
    background: #fff;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .field textarea { resize: vertical; min-height: 60px; }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99,102,241,.13);
  }
  .btns { display: flex; gap: 8px; margin-top: 14px; }
  .btn-primary {
    flex: 1;
    padding: 11px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(99,102,241,.3);
  }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-ghost {
    padding: 11px 16px;
    border: 1px solid #dcdfe4;
    border-radius: 10px;
    background: #fff;
    color: #374151;
    cursor: pointer;
  }
  .btn-ghost:hover { background: #f3f4f6; }

  /* 列表 */
  .list-toolbar {
    flex-shrink: 0;
    display: flex;
    gap: 8px;
    padding: 0 18px 12px;
  }
  .list-toolbar input {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    border: 1px solid #dcdfe4;
    border-radius: 10px;
    outline: none;
  }
  .list-toolbar input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.13); }
  .list-toolbar select {
    padding: 10px 8px;
    border: 1px solid #dcdfe4;
    border-radius: 10px;
    background: #fff;
    outline: none;
  }

  .list-body {
    flex: 1;
    min-height: 120px;
    overflow-y: auto;
    padding: 0 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .w-item {
    border: 1px solid #e8eaee;
    border-radius: 11px;
    padding: 11px 13px;
    transition: box-shadow .15s, border-color .15s;
  }
  .w-item:hover { border-color: #cfd4dc; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .w-item.learned { background: #f7fdf9; border-color: #cdebd6; }

  .w-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .w-left { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .w-word { font-size: 16px; font-weight: 700; word-break: break-word; }
  .w-item.learned .w-word { color: #16a34a; }
  .w-phonetic { font-size: 13px; color: #8b9098; font-family: "Times New Roman", serif; }

  .w-actions { display: flex; gap: 2px; flex-shrink: 0; }
  .icon-btn {
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 15px;
    padding: 3px 5px;
    border-radius: 6px;
    line-height: 1;
    opacity: .55;
    transition: opacity .15s, background .15s;
  }
  .icon-btn:hover { opacity: 1; background: #eef0f3; }

  .w-meaning { margin-top: 6px; font-size: 14px; color: #3a3f45; display: flex; gap: 7px; align-items: baseline; }
  .pos {
    flex-shrink: 0;
    font-size: 11px;
    color: #7c3aed;
    background: #f3eeff;
    padding: 1px 6px;
    border-radius: 5px;
    font-style: italic;
  }
  .w-example {
    margin-top: 6px;
    font-size: 12.5px;
    color: #6b7280;
    border-left: 3px solid #e5e7eb;
    padding-left: 9px;
    line-height: 1.55;
    word-break: break-word;
  }

  .empty { text-align: center; color: #9ca3af; padding: 40px 10px; font-size: 14px; line-height: 1.9; }

  .list-foot {
    flex-shrink: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 12px 18px 16px;
    border-top: 1px solid #eef0f3;
    background: #fcfcfd;
  }
  .list-foot > * {
    flex: 1 1 88px;
    text-align: center;
    padding: 8px 6px;
    font-size: 12.5px;
    border: 1px solid #dcdfe4;
    border-radius: 9px;
    background: #fff;
    color: #374151;
    cursor: pointer;
  }
  .list-foot > *:hover { background: #f3f4f6; }
  .list-foot .danger { color: #dc2626; border-color: #fecaca; }
  .list-foot .danger:hover { background: #fef2f2; }
  .file-label input { display: none; }

  /* 提示条 */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 92px;
    transform: translateX(-50%) translateY(12px);
    background: #1f2937;
    color: #fff;
    padding: 11px 20px;
    border-radius: 10px;
    font-size: 13px;
    z-index: 300;
    box-shadow: 0 8px 24px rgba(0,0,0,.22);
    opacity: 0;
    transition: opacity .25s, transform .25s;
    max-width: 88vw;
    text-align: center;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="app">
  <div class="review-top">
    <span class="brand">📖 单词本</span>
    <span class="progress" id="progress"></span>
    <label class="only-unlearned">
      <input type="checkbox" id="onlyUnlearned"><span>仅未掌握</span>
    </label>
  </div>

  <div class="stage" id="stage">
    <div class="card-slot" id="cardSlot">
      <div class="flip-card" id="flipCard">
        <div class="flip-inner" id="flipInner">
          <div class="flip-face front">
            <div class="r-word" id="rWord"></div>
            <div class="r-phonetic" id="rPhonetic"></div>
          </div>
          <div class="flip-face back">
            <div class="r-back-word" id="rBackWord"></div>
            <div class="r-pos" id="rPos"></div>
            <div class="r-meaning" id="rMeaning"></div>
            <div class="r-example" id="rExample"></div>
          </div>
        </div>
      </div>

      <div class="empty-stage" id="emptyStage" hidden>
        <div class="empty-emoji">📚</div>
        <div class="empty-title" id="emptyTitle">还没有单词</div>
        <div class="empty-sub" id="emptySub">点下方「添加」创建第一个单词吧</div>
      </div>
    </div>
  </div>

  <nav class="dock">
    <button id="btnAdd"><span class="ico">➕</span><span class="lbl">添加</span></button>
    <button id="btnList"><span class="ico">📋</span><span class="lbl">单词列表</span></button>
    <button id="btnLearned"><span class="ico">✅</span><span class="lbl">已掌握</span></button>
    <button id="btnNext" class="primary"><span class="ico">🎲</span><span class="lbl">下一张</span></button>
  </nav>
</div>

<div class="modal" id="formModal" hidden>
  <div class="modal-panel">
    <div class="modal-head">
      <h2 id="formTitle">添加单词</h2>
      <button class="modal-close" data-close>✕</button>
    </div>
    <div class="modal-body">
      <form id="wordForm">
        <div class="field"><input id="fWord" placeholder="单词 *" required autocomplete="off"></div>
        <div class="field"><input id="fPhonetic" placeholder="音标，如 /ˈæpl/" autocomplete="off"></div>
        <div class="field">
          <select id="fPos">
            <option value="">词性（可选）</option>
            <option value="n.">n. 名词</option>
            <option value="v.">v. 动词</option>
            <option value="adj.">adj. 形容词</option>
            <option value="adv.">adv. 副词</option>
            <option value="pron.">pron. 代词</option>
            <option value="prep.">prep. 介词</option>
            <option value="conj.">conj. 连词</option>
            <option value="num.">num. 数词</option>
            <option value="phr.">phr. 短语</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div class="field"><input id="fMeaning" placeholder="中文释义 *" required autocomplete="off"></div>
        <div class="field"><textarea id="fExample" placeholder="例句（可选）"></textarea></div>
        <div class="field"><input id="fNumber" placeholder="编号（可选，界面不显示）" autocomplete="off"></div>
        <div class="btns">
          <button type="submit" class="btn-primary" id="submitBtn">添加</button>
          <button type="button" class="btn-ghost" data-close>取消</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal" id="listModal" hidden>
  <div class="modal-panel wide">
    <div class="modal-head">
      <h2>单词列表 <span class="count" id="listCount"></span></h2>
      <button class="modal-close" data-close>✕</button>
    </div>

    <div class="list-toolbar">
      <input id="search" placeholder="🔍 搜索单词、释义或例句" autocomplete="off">
      <select id="filter">
        <option value="all">全部</option>
        <option value="unlearned">未掌握</option>
        <option value="learned">已掌握</option>
      </select>
    </div>

    <div class="list-body" id="list"></div>

    <div class="list-foot">
      <button id="exportJson">导出 JSON</button>
      <button id="exportCsv">导出 CSV</button>
      <label class="file-label">导入<input type="file" id="importFile" accept=".json"></label>
      <button id="restoreSeeds">恢复基础词</button>
      <button id="clearAll" class="danger">清空全部</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'wordbook.v1';
const SETTING_KEY = 'wordbook.onlyUnlearned';
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

let words = [];
let editingId = null;

const SEED_WORDS = [
  { word: 'apple',     phonetic: '/ˈæpl/',        pos: 'n.', meaning: '苹果',        example: 'I eat an apple every day. 我每天吃一个苹果。' },
  { word: 'book',      phonetic: '/bʊk/',         pos: 'n.', meaning: '书',          example: 'This book is very interesting. 这本书很有趣。' },
  { word: 'water',     phonetic: '/ˈwɔːtər/',     pos: 'n.', meaning: '水',          example: 'Please give me a glass of water. 请给我一杯水。' },
  { word: 'friend',    phonetic: '/frend/',       pos: 'n.', meaning: '朋友',        example: 'She is my best friend. 她是我最好的朋友。' },
  { word: 'family',    phonetic: '/ˈfæməli/',     pos: 'n.', meaning: '家庭；家人',  example: 'I love my family. 我爱我的家人。' },
  { word: 'school',    phonetic: '/skuːl/',       pos: 'n.', meaning: '学校',        example: 'We go to school by bus. 我们坐公交车去学校。' },
  { word: 'teacher',   phonetic: '/ˈtiːtʃər/',    pos: 'n.', meaning: '老师',        example: 'Our teacher is very kind. 我们的老师很和蔼。' },
  { word: 'student',   phonetic: '/ˈstuːdnt/',    pos: 'n.', meaning: '学生',        example: 'He is a good student. 他是个好学生。' },
  { word: 'house',     phonetic: '/haʊs/',        pos: 'n.', meaning: '房子',        example: 'They live in a big house. 他们住在一栋大房子里。' },
  { word: 'food',      phonetic: '/fuːd/',        pos: 'n.', meaning: '食物',        example: 'Chinese food is delicious. 中国菜很好吃。' },
  { word: 'time',      phonetic: '/taɪm/',        pos: 'n.', meaning: '时间',        example: 'What time is it now? 现在几点了？' },
  { word: 'day',       phonetic: '/deɪ/',         pos: 'n.', meaning: '天；白天',     example: 'Have a nice day! 祝你今天愉快！' },
  { word: 'year',      phonetic: '/jɪr/',         pos: 'n.', meaning: '年',          example: 'I will go there next year. 我明年会去那儿。' },
  { word: 'money',     phonetic: '/ˈmʌni/',       pos: 'n.', meaning: '钱',          example: 'He saves money every month. 他每个月都存钱。' },
  { word: 'city',      phonetic: '/ˈsɪti/',       pos: 'n.', meaning: '城市',        example: 'Beijing is a big city. 北京是一座大城市。' },
  { word: 'country',   phonetic: '/ˈkʌntri/',     pos: 'n.', meaning: '国家',        example: 'China is a beautiful country. 中国是个美丽的国家。' },
  { word: 'language',  phonetic: '/ˈlæŋɡwɪdʒ/',   pos: 'n.', meaning: '语言',        example: 'English is a useful language. 英语是一门有用的语言。' },
  { word: 'music',     phonetic: '/ˈmjuːzɪk/',    pos: 'n.', meaning: '音乐',        example: 'I like listening to music. 我喜欢听音乐。' },
  { word: 'question',  phonetic: '/ˈkwestʃən/',   pos: 'n.', meaning: '问题',        example: 'May I ask a question? 我可以问个问题吗？' },
  { word: 'answer',    phonetic: '/ˈænsər/',      pos: 'n.', meaning: '答案',        example: 'I don\'t know the answer. 我不知道答案。' },
  { word: 'go',        phonetic: '/ɡoʊ/',         pos: 'v.', meaning: '去',          example: 'Let\'s go home. 我们回家吧。' },

function normalizeWord(w) {
  return {
    id: w.id || uid(),
    number: w.number == null ? '' : String(w.number),
    word: w.word || '',
    phonetic: w.phonetic || '',
    pos: w.pos || '',
    meaning: w.meaning || '',
    example: w.example || '',
    learned: !!w.learned,
    addedAt: w.addedAt || Date.now()
  };
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(words)); } catch (e) {}
}

function loadSettings() {
  try { $('onlyUnlearned').checked = localStorage.getItem(SETTING_KEY) === '1'; } catch (e) {}
}
function saveSettings() {
  try { localStorage.setItem(SETTING_KEY, $('onlyUnlearned').checked ? '1' : '0'); } catch (e) {}
}

function restoreSeeds(silent) {
  const existing = new Set(words.map(w => w.word.toLowerCase()));
  const now = Date.now();
  const added = SEED_WORDS
    .filter(s => !existing.has(s.word.toLowerCase()))
    .map((s, i) => ({
      id: uid() + i,
      number: '',
      word: s.word,
      phonetic: s.phonetic,
      pos: s.pos,
      meaning: s.meaning,
      example: s.example,
      learned: false,
      addedAt: now - i * 1000
    }));
  words = words.concat(added);
  save();
  if (!silent) toast(added.length ? `已补充 ${added.length} 个基础单词` : '基础单词已全部在单词本中');
  return added.length;
}

function load() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { raw = null; }
  if (raw) {
    try {
      const data = JSON.parse(raw);
      if (Array.isArray(data) && data.length) {
        words = data.map(normalizeWord);
        return false;
      }
    } catch (e) {}
  }
  words = [];
  restoreSeeds(true);
  return true;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}

function toast(msg) {
  const t = el('div', 'toast', msg);
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 300);
  }, 2500);
}

/* ==========================================================
   尺寸计算：1.98:1 横版比例
   ========================================================== */
const CARD_RATIO = 1.98; // 宽/高
const CARD_MAX_W = 1200; // 最大宽度
const stageEl = $('stage');
const cardSlot = $('cardSlot');

function fitCard() {
  const r = stageEl.getBoundingClientRect();
  if (r.width < 2 || r.height < 2) return;

  // 根据舞台可用宽高计算卡片尺寸
  let maxW = Math.min(r.width, CARD_MAX_W);
  let maxH = r.height - 10;

  let w = maxW;
  let h = w / CARD_RATIO;

  if (h > maxH) {
    h = maxH;
    w = h * CARD_RATIO;
  }

  w = Math.floor(w);
  h = Math.floor(h);

  cardSlot.style.width = w + 'px';
  cardSlot.style.height = h + 'px';
  cardSlot.style.setProperty('--cw', w + 'px');
}

window.addEventListener('resize', fitCard);
window.addEventListener('orientationchange', () => setTimeout(fitCard, 120));

/* ==========================================================
   随机复习
   ========================================================== */
const flipCard = $('flipCard');
const flipInner = $('flipInner');

let reviewPool = [];
let deck = [];
let currentId = null;
let reviewedCount = 0;

function buildPool() {
  return words.filter(w => !$('onlyUnlearned').checked || !w.learned).map(w => w.id);
}

function resetFlip() {
  flipInner.style.transition = 'none';
  flipCard.classList.remove('flipped');
  void flipInner.offsetWidth;
  flipInner.style.transition = '';
}

function fillCard(w) {
  $('rWord').textContent = w.word;
  $('rPhonetic').textContent = w.phonetic || '';

  $('rBackWord').textContent = w.word;
  if (w.phonetic) $('rBackWord').appendChild(el('span', null, '  ' + w.phonetic));

  $('rPos').textContent = w.pos || '';
  $('rPos').hidden = !w.pos;
  $('rMeaning').textContent = w.meaning;
  $('rExample').textContent = w.example || '';
  $('rExample').hidden = !w.example;

  updateLearnedBtn();
}

function updateProgress() {
  $('progress').textContent = reviewPool.length
    ? `已复习 ${reviewedCount} 张 · 本组 ${reviewPool.length} 个`
    : '';
}

function updateLearnedBtn() {
  const btn = $('btnLearned');
  const w = words.find(x => x.id === currentId);
  if (!w) {
    btn.disabled = true;
    btn.classList.remove('done');
    btn.querySelector('.ico').textContent = '✅';
    btn.querySelector('.lbl').textContent = '已掌握';
    return;
  }
  btn.disabled = false;
  btn.classList.toggle('done', w.learned);
  btn.querySelector('.ico').textContent = w.learned ? '↩️' : '✅';
  btn.querySelector('.lbl').textContent = w.learned ? '取消掌握' : '已掌握';
}

function showEmpty() {
  currentId = null;
  $('flipCard').hidden = true;
  $('emptyStage').hidden = false;

  if (!words.length) {
    $('emptyTitle').textContent = '还没有单词';
    $('emptySub').textContent = '点下方「添加」创建第一个单词吧';
    $('progress').textContent = '';
  } else {
    $('emptyTitle').textContent = '全部掌握啦 🎉';
    $('emptySub').textContent = '取消勾选「仅未掌握」可重新复习';
    $('progress').textContent = `共 ${words.length} 个 · 已全部掌握`;
  }
  updateLearnedBtn();
}

function nextCard(counted = true) {
  reviewPool = reviewPool.filter(id => words.some(w => w.id === id));
  if (!reviewPool.length) { showEmpty(); return; }

  deck = deck.filter(id => reviewPool.includes(id));
  if (!deck.length) {
    deck = reviewPool.slice();
    if (deck.length > 1 && currentId) {
      const i = deck.indexOf(currentId);
      if (i !== -1) deck.splice(i, 1);
    }
  }

  const idx = Math.floor(Math.random() * deck.length);
  const id = deck.splice(idx, 1)[0];
  const w = words.find(x => x.id === id);
  if (!w) { nextCard(counted); return; }

  currentId = id;
  resetFlip();
  fillCard(w);

  $('flipCard').hidden = false;
  $('emptyStage').hidden = true;

  if (counted) reviewedCount++;
  updateProgress();
}

function initReview() {
  reviewPool = buildPool();
  deck = reviewPool.slice();
  currentId = null;
  reviewedCount = 0;
  if (!reviewPool.length) { showEmpty(); updateProgress(); return; }
  nextCard();
}

function syncReview() {
  const validIds = new Set(words.map(w => w.id));
  reviewPool = reviewPool.filter(id => validIds.has(id));
  deck = deck.filter(id => validIds.has(id));

  const shouldIds = buildPool();
  const inPool = new Set(reviewPool);
  shouldIds.forEach(id => {
    if (!inPool.has(id)) { reviewPool.push(id); deck.push(id); }
  });

  if (!reviewPool.length) { showEmpty(); updateProgress(); return; }

  if (!currentId || !validIds.has(currentId)) {
    nextCard(false);
  } else {
    fillCard(words.find(w => w.id === currentId));
    $('flipCard').hidden = false;
    $('emptyStage').hidden = true;
    updateProgress();
  }
}

let suppressClick = false;
flipCard.addEventListener('click', () => {
  if (suppressClick) return;
  flipCard.classList.toggle('flipped');
});

let tStartX = 0, tStartY = 0, tMoved = false;
flipCard.addEventListener('touchstart', e => {
  const t = e.touches[0];
  tStartX = t.clientX; tStartY = t.clientY; tMoved = false;
}, { passive: true });
flipCard.addEventListener('touchmove', e => {
  const t = e.touches[0];
  if (Math.abs(t.clientX - tStartX) > 10 || Math.abs(t.clientY - tStartY) > 10) tMoved = true;
}, { passive: true });
flipCard.addEventListener('touchend', e => {
  if (!tMoved) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - tStartX;
  const dy = t.clientY - tStartY;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 350);
    if (dx < 0) nextCard();
    else flipCard.classList.toggle('flipped');
  }
}, { passive: true });

$('btnNext').onclick = () => nextCard();

$('btnLearned').onclick = () => {
  const w = words.find(x => x.id === currentId);
  if (!w) return;

  if (w.learned) {
    w.learned = false;
    save();
    toast(`已取消「${w.word}」的掌握标记`);
    if (!reviewPool.includes(w.id)) { reviewPool.push(w.id); deck.push(w.id); }
    fillCard(w);
    updateProgress();
    renderList();
  } else {
    w.learned = true;
    save();
    toast(`「${w.word}」已掌握 ✅`);
    if ($('onlyUnlearned').checked) {
      reviewPool = reviewPool.filter(id => id !== w.id);
      deck = deck.filter(id => id !== w.id);
    }
    renderList();
    if (!reviewPool.length) { showEmpty(); updateProgress(); }
    else nextCard();
  }
};

$('onlyUnlearned').addEventListener('change', () => {
  saveSettings();
  initReview();
});

/* ==========================================================
   列表
   ========================================================== */
function renderList() {
  const q = ($('search').value || '').trim().toLowerCase();
  const filter = $('filter').value;

  const filtered = words
    .filter(w => {
      if (filter === 'learned' && !w.learned) return false;
      if (filter === 'unlearned' && w.learned) return false;
      if (!q) return true;
      return [w.word, w.meaning, w.phonetic, w.pos, w.example]
        .join(' ').toLowerCase().includes(q);
    })
    .sort((a, b) => b.addedAt - a.addedAt);

  $('listCount').textContent = `(${filtered.length}/${words.length})`;
  const list = $('list');
  list.innerHTML = '';

  if (!filtered.length) {
    const box = el('div', 'empty');
    box.innerHTML = words.length
      ? (q ? `没有找到包含「${escapeHtml(q)}」的单词` : '没有符合筛选条件的单词')
      : '还没有单词，点「添加」创建第一个吧 ✨';
    list.appendChild(box);
    return;
  }

  filtered.forEach(w => list.appendChild(itemEl(w)));
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function itemEl(w) {
  const c = el('div', 'w-item' + (w.learned ? ' learned' : ''));
  const top = el('div', 'w-top');
  const left = el('div', 'w-left');
  left.appendChild(el('span', 'w-word', w.word));
  if (w.phonetic) left.appendChild(el('span', 'w-phonetic', w.phonetic));
  top.appendChild(left);

  const actions = el('div', 'w-actions');
  const btnLearned = el('button', 'icon-btn', w.learned ? '✅' : '⬜');
  btnLearned.title = w.learned ? '标记为未掌握' : '标记为已掌握';
  btnLearned.onclick = () => {
    w.learned = !w.learned;
    save();
    renderList();
    syncReview();
  };

  const btnEdit = el('button', 'icon-btn', '✏️');
  btnEdit.title = '编辑';
  btnEdit.onclick = () => openForm(w);

  const btnDel = el('button', 'icon-btn', '🗑️');
  btnDel.title = '删除';
  btnDel.onclick = () => removeWord(w.id);

  actions.append(btnLearned, btnEdit, btnDel);
  top.appendChild(actions);
  c.appendChild(top);

  const meaning = el('div', 'w-meaning');
  if (w.pos) meaning.appendChild(el('span', 'pos', w.pos));
  meaning.appendChild(el('span', null, w.meaning));
  c.appendChild(meaning);

  if (w.example) c.appendChild(el('div', 'w-example', w.example));
  return c;
}

function removeWord(id) {
  const w = words.find(x => x.id === id);
  if (!w) return;
  if (!confirm(`确定删除「${w.word}」吗？`)) return;
  words = words.filter(x => x.id !== id);
  save();
  renderList();
  syncReview();
  toast('已删除');
}

$('search').addEventListener('input', renderList);
$('filter').addEventListener('change', renderList);

/* ==========================================================
   表单与模态框
   ========================================================== */
function openForm(w) {
  editingId = w ? w.id : null;
  $('formTitle').textContent = w ? '编辑单词' : '添加单词';
  $('submitBtn').textContent = w ? '保存修改' : '添加';

  $('fWord').value = w ? w.word : '';
  $('fPhonetic').value = w ? (w.phonetic || '') : '';
  $('fPos').value = w ? (w.pos || '') : '';
  $('fMeaning').value = w ? w.meaning : '';
  $('fExample').value = w ? (w.example || '') : '';
  $('fNumber').value = w ? (w.number || '') : '';

  openModal($('formModal'));
  setTimeout(() => $('fWord').focus(), 60);
}

$('wordForm').addEventListener('submit', e => {
  e.preventDefault();
  const data = {
    number: $('fNumber').value.trim(),
    word: $('fWord').value.trim(),
    phonetic: $('fPhonetic').value.trim(),
    pos: $('fPos').value,
    meaning: $('fMeaning').value.trim(),
    example: $('fExample').value.trim()
  };
  if (!data.word || !data.meaning) return;

  if (editingId) {
    const target = words.find(w => w.id === editingId);
    if (target) Object.assign(target, data);
    toast('已保存修改');
  } else {
    words.push({
      id: uid(),
      ...data,
      learned: false,
      addedAt: Date.now()
    });
    toast(`已添加「${data.word}」`);
  }

  save();
  closeModal($('formModal'));
  renderList();
  syncReview();
  editingId = null;
});

function openModal(m) { m.hidden = false; document.body.style.overflow = 'hidden'; }
function closeModal(m) {
  m.hidden = true;
  if (!$('formModal').hidden || !$('listModal').hidden) return;
  document.body.style.overflow = '';
}

document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => closeModal(btn.closest('.modal')));
});
document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) closeModal(m); });
});

$('btnAdd').onclick = () => openForm(null);
$('btnList').onclick = () => { renderList(); openModal($('listModal')); setTimeout(() => $('search').focus(), 80); };

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!$('formModal').hidden) { closeModal($('formModal')); return; }
    if (!$('listModal').hidden) { closeModal($('listModal')); return; }
    return;
  }
  const modalOpen = !$('formModal').hidden || !$('listModal').hidden;
  if (modalOpen) return;
  const onControl = e.target.matches('input, button, select, textarea');
  if ((e.key === ' ' || e.key === 'Enter') && !onControl) {
    e.preventDefault();
    if (!$('flipCard').hidden) flipCard.classList.toggle('flipped');
  } else if (e.key === 'ArrowRight' && !onControl) {
    e.preventDefault();
    if (!$('flipCard').hidden) nextCard();
  }
});

/* ==========================================================
   导入导出
   ========================================================== */
function download(filename, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function today() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}`;
}

$('exportJson').onclick = () => {
  if (!words.length) return alert('单词本还是空的哦');
  download(`单词本_${today()}.json`, JSON.stringify(words, null, 2), 'application/json');
};

$('exportCsv').onclick = () => {
  if (!words.length) return alert('单词本还是空的哦');
  const esc = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
  const rows = [['编号', '单词', '音标', '词性', '释义', '例句', '已掌握']];
  words.forEach(w => {
    rows.push([w.number || '', w.word, w.phonetic, w.pos, w.meaning, w.example, w.learned ? '是' : '否']);
  });
  const csv = '\uFEFF' + rows.map(r => r.map(esc).join(',')).join('\r\n');
  download(`单词本_${today()}.csv`, csv, 'text/csv;charset=utf-8');
};

$('importFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data)) throw new Error('文件格式不正确');
      const valid = data.filter(w => w && typeof w.word === 'string' && typeof w.meaning === 'string').map(normalizeWord);
      if (!valid.length) throw new Error('没有有效数据');

      const existing = new Set(words.map(w => w.word.toLowerCase()));
      const added = valid.filter(w => !existing.has(w.word.toLowerCase()));
      words = words.concat(added);
      save();
      renderList();
      syncReview();
      alert(`导入成功，新增 ${added.length} 个单词` + (valid.length - added.length ? `，跳过 ${valid.length - added.length} 个重复项` : ''));
    } catch (err) { alert('导入失败：' + err.message); }
    e.target.value = '';
  };
  reader.readAsText(file);
});

$('restoreSeeds').onclick = () => { restoreSeeds(false); renderList(); syncReview(); };

$('clearAll').onclick = () => {
  if (!words.length) return alert('单词本已经是空的了');
  if (!confirm(`确定清空全部 ${words.length} 个单词吗？此操作不可恢复。`)) return;
  words = [];
  save();
  renderList();
  initReview();
  toast('单词本已清空');
};

/* ==========================================================
   启动
   ========================================================== */
const isFirstLoad = load();
loadSettings();
renderList();
initReview();
fitCard();
requestAnimationFrame(fitCard);
setTimeout(fitCard, 120);

if (isFirstLoad) {
  setTimeout(() => toast('✨ 已内置 60 个基础单词，点「下一张」开始记忆'), 600);
}

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .catch(error => console.error('离线缓存注册失败：', error));
  });
}
</script>
